[package]
name = "gitmaps"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "GitMapsGame: a read-only crossing map derived from a GitHub repository"
license = "MIT"
repository = "https://github.com/Tesliana-code/GitMapsGame"
publish = false
include = ["src/**", "index.html", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md"]

[dependencies]
serde_json = "1"
sha2 = "0.10"
# rustls on the ring provider with bundled webpki roots: no OpenSSL, no cmake, no system CA lookup.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
codegen-units = 1
lto = true
